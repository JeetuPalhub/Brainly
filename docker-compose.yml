# Local dev stack: API + MongoDB.
# Usage:
#   1. create backend/.env with JWT_SECRET (and optionally HF_API_TOKEN)
#   2. docker compose up --build
#   API -> http://localhost:3000   |   Mongo -> mongodb://localhost:27017
services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/secondbrain
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
